# Server Configuration
server.port=8080

# Spring Application
spring.application.name=SmartCampus-ERP

# Database Connectivity (JDBC - PostgreSQL / Supabase)
# Values use placeholders with default fallbacks, overrideable via environment variables:
# DB_URL, DB_USER, DB_PASSWORD
db.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
db.username=${DB_USER:postgres}
db.password=${DB_PASSWORD:password}
db.driver-class-name=org.postgresql.Driver
