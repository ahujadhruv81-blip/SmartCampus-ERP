# Server Configuration
server.port=8080

# Spring Application
spring.application.name=SmartCampus-ERP

# Database Connectivity (JDBC)
# Values use placeholders with default fallbacks, overrideable via environment variables:
# DB_URL, DB_USER, DB_PASSWORD
db.url=${DB_URL:jdbc:mysql://localhost:3306/smartcampus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
db.username=${DB_USER:root}
db.password=${DB_PASSWORD:password}
db.driver-class-name=com.mysql.cj.jdbc.Driver
